<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Tâm lý học cho sự thay đổi triệt để</title>
  <desc id="desc">A refined abstract audiobook cover with layered translucent forms and contemplative geometric lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0ddc3"/>
      <stop offset="0.48" stop-color="#dfe8e2"/>
      <stop offset="1" stop-color="#716b8f"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7d8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#bb8663" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.34"/>
