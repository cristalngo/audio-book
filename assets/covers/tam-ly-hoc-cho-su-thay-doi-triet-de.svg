    <path d="M128 598 C252 482 376 482 500 598"/>
    <path d="M402 598 C528 482 654 482 780 598"/>
    <path d="M164 912 C308 838 462 838 606 912"/>
    <path d="M242 1000 C350 954 464 954 572 1000"/>
  </g>
  <g fill="none" stroke="#615a7d" stroke-width="3" opacity="0.34">
    <path d="M450 352 V1016"/>
    <path d="M276 740 H704"/>
    <path d="M338 522 L590 944"/>
    <path d="M590 522 L338 944"/>
  </g>
  <circle cx="450" cy="738" r="72" fill="#fff4c9" opacity="0.54"/>
  <text x="92" y="138" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4" fill="#615a7d">SAMAEL AUN WEOR</text>
  <text x="92" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" fill="#24312c">
